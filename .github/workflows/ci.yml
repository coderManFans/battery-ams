name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml -pl asset-service,warehouse-service,workorder-service,preservation-service,telemetry-service -am test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full-stack Compose configuration
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.full.yml config --quiet
      - name: Validate Dockerfile syntax and build contexts
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f deploy/mysql/init/01-databases.sql
          test -f docs/FULL_STACK_DEMO.md
