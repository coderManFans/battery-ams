server:
  port: 8082
spring:
  application:
    name: warehouse-service
  datasource:
    url: jdbc:mysql://localhost:3306/warehouse_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: battery_demo
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info

warehouse:
  reservation-expiry:
    delay-ms: 30000

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: battery-warehouse-producer
    send-message-timeout: 5000
    retry-times-when-send-failed: 2

warehouse:
  outbox-relay:
    delay-ms: 2000
