server:
  port: 8082
spring:
  application:
    name: warehouse-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/warehouse_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:battery_demo}
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: battery-warehouse-producer
    send-message-timeout: 5000
    retry-times-when-send-failed: 2
warehouse:
  reservation-expiry:
    delay-ms: 30000
  outbox-relay:
    delay-ms: 2000
