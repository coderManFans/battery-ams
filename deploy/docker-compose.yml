services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: battery_demo
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: [mysql_data:/var/lib/mysql, ./mysql/init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pbattery_demo"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: battery-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 256M
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: battery-rocketmq-broker
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    command: sh mqbroker -n rocketmq-namesrv:9876 autoCreateTopicEnable=true
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    volumes:
      - rocketmq_data:/home/rocketmq/store
volumes:
  mysql_data:
  redis_data:
  rocketmq_data:
